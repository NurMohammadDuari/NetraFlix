name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Syntax-check every original JS file. No build step, no deps.
      - name: Node syntax check
        run: |
          node --check server/server.mjs
          node --check clone/server.mjs
          node --check clone/patch.mjs

      # Validate every JSON file parses.
      - name: Validate JSON
        run: |
          node -e 'const fs=require("fs");for(const f of ["server/package.json","clone/package.json","clone/manifest.webmanifest"]){JSON.parse(fs.readFileSync(f,"utf8"));console.log("ok:",f)}'

      # Guard: no third-party proprietary code may ever be committed.
      - name: Guard against third-party code
        run: |
          git ls-files | grep -E '^(original|source|recovered|recovered-heuristic|evidence)/|clone/assets/|clone/fu\.wasm|clone/vidlink_exec\.js|clone/sw\.js|clone/icon-(192|512)\.png' \
            && { echo "ERROR: third-party proprietary code must not be committed (see NOTICE)"; exit 1; } \
            || echo "clean: no third-party code in tree"
